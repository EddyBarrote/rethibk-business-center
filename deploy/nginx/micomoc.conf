# MICOMOC — Nginx. Modelo: deploy/provision.sh e deploy/tls.sh trocam os @@…@@ e instalam
# em /etc/nginx/sites-available/micomoc.conf. Editar aqui, no repositório, não no servidor.
#
#   @@DOMAIN@@          domínio central (APP_URL, TENANCY_CENTRAL_DOMAIN)
#   {slug}.@@DOMAIN@@   cada tenant (app/Tenancy/IdentifyTenant.php)
#   admin.@@DOMAIN@@    consola do super admin (TENANCY_ADMIN_DOMAIN)
#   ws.@@DOMAIN@@       Reverb (websockets), atrás deste Nginx (VITE_REVERB_HOST)
#
# Um tenant com domínio próprio (tenants.domain) precisa de um server à parte, com o seu
# certificado: docs/DEPLOY.md, «Domínio próprio de um tenant».
# Nginx 1.24 (Ubuntu 24.04): `listen … ssl http2` (a directiva `http2 on` só existe a partir do 1.25).

map $http_upgrade $micomoc_connection_upgrade {
    default upgrade;
    ''      close;
}

# Porta 80: o desafio do Let's Encrypt (renovações por HTTP-01) e o resto para HTTPS.
server {
    listen 80;
    listen [::]:80;
    server_name .@@DOMAIN@@;
    server_tokens off;

    location ^~ /.well-known/acme-challenge/ {
        root @@ACME_ROOT@@;
        default_type text/plain;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# Reverb: o browser liga-se a wss://ws.@@DOMAIN@@ e o Nginx passa para 127.0.0.1:@@REVERB_LOCAL_PORT@@.
# Um nome exacto ganha ao .@@DOMAIN@@ do server da plataforma.
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name ws.@@DOMAIN@@;
    server_tokens off;

    ssl_certificate     /etc/letsencrypt/live/@@CERT_NAME@@/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/@@CERT_NAME@@/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:MICOMOC_WS:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    access_log /var/log/nginx/micomoc-ws.access.log;
    error_log  /var/log/nginx/micomoc-ws.error.log;

    location / {
        proxy_pass http://127.0.0.1:@@REVERB_LOCAL_PORT@@;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header Scheme $scheme;
        proxy_set_header SERVER_PORT $server_port;
        proxy_set_header REMOTE_ADDR $remote_addr;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $micomoc_connection_upgrade;
        # O Reverb faz ping a cada 60 s (REVERB_APP_PING_INTERVAL): a ligação nunca fica 5 min calada.
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        proxy_buffering off;
    }
}

# Plataforma: domínio central, consola do super admin e todos os tenants.
server {
    listen 443 ssl http2 default_server;
    listen [::]:443 ssl http2 default_server;
    server_name .@@DOMAIN@@;
    server_tokens off;

    root @@APP_ROOT@@/current/public;
    index index.php;
    charset utf-8;

    ssl_certificate     /etc/letsencrypt/live/@@CERT_NAME@@/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/@@CERT_NAME@@/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:MICOMOC:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    include /etc/nginx/snippets/micomoc-security-headers.conf;

    access_log /var/log/nginx/micomoc.access.log;
    error_log  /var/log/nginx/micomoc.error.log;

    # Igual ao post_max_size do pool do PHP-FPM (deploy/php/micomoc-fpm.conf). Os anexos e o
    # repositório de ficheiros sobem em partes de 4 MB, por isso ficheiros de 100 MB também passam.
    client_max_body_size 128m;
    client_body_timeout 300s;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml text/javascript application/javascript application/json
               application/xml application/rss+xml application/manifest+json image/svg+xml
               font/ttf font/otf application/vnd.ms-fontobject;

    location = /favicon.ico { access_log off; log_not_found off; try_files $uri =404; }
    location = /robots.txt  { access_log off; log_not_found off; try_files $uri =404; }

    # Verificação de disponibilidade (base de dados e Redis): sem registo de acesso.
    location = /up {
        access_log off;
        try_files $uri /index.php?$query_string;
    }

    # Build do Vite: nomes com hash, por isso cache de um ano.
    location ^~ /build/ {
        include /etc/nginx/snippets/micomoc-security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        access_log off;
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # Só o index.php corre, e só por dentro (try_files); os outros .php dão 404.
    location ~ ^/index\.php(/|$) {
        fastcgi_pass unix:@@FPM_SOCK@@;
        fastcgi_split_path_info ^(.+\.php)(/.*)$;
        include fastcgi_params;
        # $realpath_root: cada release tem a sua pasta e `current` é um link simbólico.
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT $realpath_root;
        fastcgi_param HTTP_PROXY "";
        fastcgi_hide_header X-Powered-By;
        fastcgi_read_timeout 300s;
        fastcgi_buffer_size 64k;
        fastcgi_buffers 16 64k;
        internal;
    }

    location ~ \.php$ {
        return 404;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }
}
