# MICOMOC — cabeçalhos de segurança (incluído em cada location que use add_header,
# porque um add_header dentro de uma location anula os do server).
add_header X-Frame-Options "SAMEORIGIN" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
# Microfone só para a própria plataforma (ditado e áudio nas conversas).
add_header Permissions-Policy "camera=(), geolocation=(), payment=(), usb=(), microphone=(self)" always;
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
