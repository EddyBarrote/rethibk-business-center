# MICOMOC — Nginx antes de haver certificado (deploy/provision.sh). Só responde ao desafio
# HTTP-01 do Let's Encrypt; deploy/tls.sh troca este ficheiro por micomoc.conf.
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name .@@DOMAIN@@ _;
    server_tokens off;

    location ^~ /.well-known/acme-challenge/ {
        root @@ACME_ROOT@@;
        default_type text/plain;
    }

    location / {
        default_type text/plain;
        return 503 "Plataforma em instalação.\n";
    }
}
