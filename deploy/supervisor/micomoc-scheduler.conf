; MICOMOC — agendador (escrito por deploy/provision.sh): routes/console.php
; (mail:fetch e agents:run-routines a cada minuto, briefings, vigias, calendar:sync…).
; Só o schedule:work recebe o sinal ao parar (stopasgroup/killasgroup desligados):
; um schedule:run que esteja a meio acaba e larga o bloqueio do withoutOverlapping.
; Se um comando com withoutOverlapping morrer a meio (falta de memória, reinício),
; fica bloqueado até 24 h: `php artisan schedule:clear-cache` liberta-o.
[program:micomoc-scheduler]
process_name=%(program_name)s
command=@@PHP_BIN@@ @@APP_ROOT@@/current/artisan schedule:work
directory=@@APP_ROOT@@/current
user=@@APP_USER@@
environment=HOME="/home/@@APP_USER@@",USER="@@APP_USER@@",PATH="/usr/local/bin:/usr/bin:/bin"
autostart=true
autorestart=true
startsecs=3
stopsignal=TERM
stopwaitsecs=60
stopasgroup=false
killasgroup=false
redirect_stderr=true
stdout_logfile=@@LOG_DIR@@/scheduler.log
stdout_logfile_maxbytes=20MB
stdout_logfile_backups=5
