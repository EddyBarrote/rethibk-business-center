; MICOMOC — Horizon (escrito por deploy/provision.sh).
; As filas e os processos vêm de config/horizon.php, pelo APP_ENV: em production
; agents-high 5, agents 10, agents-low 3, email 10, embeddings 3 e default 2 (33 processos).
; O deploy pede `horizon:terminate`: o Horizon acaba o que tem em mãos e o Supervisor
; arranca-o outra vez já na release nova. stopwaitsecs fica acima do trabalho mais
; longo (SyncErpSales, 900 s) para um `supervisorctl stop` também esperar por ele.
[program:micomoc-horizon]
process_name=%(program_name)s
command=@@PHP_BIN@@ @@APP_ROOT@@/current/artisan horizon
directory=@@APP_ROOT@@/current
user=@@APP_USER@@
environment=HOME="/home/@@APP_USER@@",USER="@@APP_USER@@",PATH="/usr/local/bin:/usr/bin:/bin"
autostart=true
autorestart=true
startsecs=5
stopsignal=TERM
stopwaitsecs=960
redirect_stderr=true
stdout_logfile=@@LOG_DIR@@/horizon.log
stdout_logfile_maxbytes=50MB
stdout_logfile_backups=5
