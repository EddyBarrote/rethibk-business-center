; MICOMOC — Reverb (escrito por deploy/provision.sh).
; Só ouve em 127.0.0.1: o Nginx recebe wss://ws.<domínio> e passa para aqui.
; O deploy pede `reverb:restart` e o Supervisor arranca-o outra vez na release nova.
[program:micomoc-reverb]
process_name=%(program_name)s
command=@@PHP_BIN@@ @@APP_ROOT@@/current/artisan reverb:start --host=127.0.0.1 --port=@@REVERB_LOCAL_PORT@@ --no-interaction
directory=@@APP_ROOT@@/current
user=@@APP_USER@@
environment=HOME="/home/@@APP_USER@@",USER="@@APP_USER@@",PATH="/usr/local/bin:/usr/bin:/bin"
autostart=true
autorestart=true
startsecs=3
stopsignal=TERM
stopwaitsecs=15
redirect_stderr=true
stdout_logfile=@@LOG_DIR@@/reverb.log
stdout_logfile_maxbytes=20MB
stdout_logfile_backups=5
