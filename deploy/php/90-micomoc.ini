; MICOMOC — PHP-FPM e CLI (escrito por deploy/provision.sh).
expose_php = Off
date.timezone = UTC

; OPcache só no FPM (opcache.enable_cli fica desligado). As releases mudam de pasta e o
; deploy recarrega o FPM, por isso a validação por data pode ficar ligada sem custo.
opcache.enable = 1
opcache.memory_consumption = 256
opcache.interned_strings_buffer = 32
opcache.max_accelerated_files = 30000
opcache.validate_timestamps = 1
opcache.revalidate_freq = 2

realpath_cache_size = 4096K
realpath_cache_ttl = 600
