; MICOMOC — pool do PHP-FPM (escrito por deploy/provision.sh).
; Corre como o utilizador da aplicação; o Nginx (www-data) fala pelo socket.
[micomoc]
user = @@APP_USER@@
group = @@APP_USER@@
listen = @@FPM_SOCK@@
listen.owner = www-data
listen.group = www-data
listen.mode = 0660

; ~50 pessoas: 24 processos chegam com folga (cada um ~60–120 MB).
pm = dynamic
pm.max_children = @@FPM_MAX_CHILDREN@@
pm.start_servers = 4
pm.min_spare_servers = 2
pm.max_spare_servers = 8
pm.max_requests = 500

; Alguns pedidos esperam pelo modelo de IA (descrever um fluxo, criar um agente): até 300 s,
; como o fastcgi_read_timeout do Nginx.
request_terminate_timeout = 300s
catch_workers_output = yes
decorate_workers_output = no

; Os anexos e o repositório de ficheiros sobem em partes de 4 MB (config/attachments.php);
; o resto (skills até 50 MB, ficheiros do Conhecimento até 25 MB, vários de cada vez) cabe aqui.
; Igual ao client_max_body_size do Nginx.
php_admin_value[memory_limit] = 512M
php_admin_value[upload_max_filesize] = 64M
php_admin_value[post_max_size] = 128M
php_admin_value[max_file_uploads] = 50
php_admin_value[max_execution_time] = 300
php_admin_value[max_input_time] = 300
php_admin_flag[display_errors] = off
php_admin_flag[log_errors] = on

; pdftotext, tesseract e docker encontram-se pelo PATH (o FPM limpa o ambiente).
env[PATH] = /usr/local/bin:/usr/bin:/bin
