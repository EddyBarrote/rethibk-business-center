# MICOMOC — Redis (incluído no fim de /etc/redis/redis.conf por deploy/provision.sh).
# Guarda as filas do Horizon, a cache e as sessões. Sem despejo: apagar chaves de uma
# fila perde trabalho dos agentes. Com AOF, as filas sobrevivem a um reinício.
maxmemory @@REDIS_MAXMEMORY@@
maxmemory-policy noeviction
appendonly yes
appendfsync everysec
